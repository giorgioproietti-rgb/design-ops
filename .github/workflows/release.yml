name: Rilascio
# Si avvia quando si crea un tag vX.Y.Z: costruisce lo zip del plugin e lo allega a una release di GitHub.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_plugin.py
      - name: Il tag deve coincidere con la versione del plugin
        run: |
          V=$(python -c "import json;print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Il tag $GITHUB_REF_NAME non coincide con la versione $V"; exit 1; }
      - run: python scripts/package_plugin.py --site-url "${{ vars.SITE_URL }}"
      - run: python scripts/release_notes.py "${GITHUB_REF_NAME#v}" > dist/notes.md
      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Design Ops $GITHUB_REF_NAME" --notes-file dist/notes.md
