name = "design-ops-wiki"
main = "index.js"
compatibility_date = "2025-01-01"

# kb.json e search.js sono generati da "python3 site/build_site.py" (il flusso "Sito" lo fa da solo).

# Workers AI: modelli gratuiti (10.000 neuroni al giorno), senza chiavi né account aggiuntivi.
[ai]
binding = "AI"

[vars]
# Origine del sito, senza barra finale e in minuscolo. Esempio: "https://organizzazione.github.io"
# Lo scrive scripts/setup_github.sh; senza questo valore il servizio rifiuta tutte le richieste.
ALLOWED_ORIGIN = "https://giorgioproietti-rgb.github.io"
LLM_PROVIDER = "workersai"
# Modelli in ordine di preferenza: se uno viene ritirato da Cloudflare si passa al successivo.
# Controlla l'elenco corrente su https://developers.cloudflare.com/workers-ai/models/
LLM_MODELS = "@cf/meta/llama-3.1-8b-instruct-fp8,@cf/meta/llama-3.2-3b-instruct"
# Quante sezioni e quanti caratteri per sezione si passano al modello (meno = più risposte al giorno).
MAX_SECTIONS = "4"
EXCERPT = "1100"
